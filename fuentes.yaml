# ─────────────────────────────────────────────────────────────────────────────
# fuentes.yaml — ÚNICO archivo de fuentes del sitio repasos-noticias
#
# Para agregar una fuente: copia un bloque de la lista `fuentes`, cambia los
# datos y guarda. Para quitarla: bórrala o pon `grupo: excluida`.
# No hace falta tocar código.
#
# Campos de cada fuente:
#   id                  identificador corto, sin espacios ni tildes
#   nombre              como se muestra en el sitio
#   sitio               página principal del medio
#   grupo               fija | especializada | general | referencia | excluida
#   tipo                tipo de fuente (ver `tipos` abajo); sirve para el filtro
#   pais                CO si es colombiana (afecta el filtro de la temática Colombia)
#   tematicas           todo lo que publica entra en estas temáticas
#   tematicas_por_filtro  solo entra si pasa las palabras clave de palabras-clave.yaml
#   metodo              rss | google_news | sin_acceso
#   feeds               lista de URLs RSS/Atom (si metodo: rss)
#   google_news         {consulta, idioma: es|en} (si metodo: google_news)
#   marcas              marcas fijas que se muestran junto a cada nota (ver `marcas`)
#                       ("Posible patrocinio" se detecta solo en el texto de cualquier nota)
#   red                 agrupa sitios hermanos en la portada (techday, la-republica)
#   solo_titulares_con  (opcional) solo entran notas cuyo titular contenga este texto
#   respaldo_google_news (opcional) {consulta, idioma}: se usa si el RSS falla por completo
#   nota                nota de marcado del documento de fuentes
#   verificado          fecha de la última verificación del método
# ─────────────────────────────────────────────────────────────────────────────

version: 1
ventana_dias: 7          # cuántos días de noticias se muestran en el sitio
zona_horaria: America/Bogota

tematicas:
  - { id: colombia,       nombre: "Colombia: negocios, economía y energía" }
  - { id: internacional,  nombre: "Internacional y mercados" }
  - { id: tecnologia,     nombre: "Tecnología e IT" }
  - { id: ciber-it,       nombre: "Ciberseguridad IT" }
  - { id: ciber-ot,       nombre: "Ciberseguridad OT" }
  - { id: manufactura,    nombre: "Manufactura" }
  - { id: sostenibilidad, nombre: "Sostenibilidad" }

grupos:
  fija:          "Fuente fija: siempre activa y destacada"
  especializada: "Especializada: todo lo que publica entra en su temática"
  general:       "Medio general: solo entran las notas que pasan el filtro de palabras clave"
  referencia:    "Datos y estudios: no van al flujo; están en Datos de referencia"
  excluida:      "Fuera del flujo diario"

tipos:
  prensa:            "Prensa"
  anuncios-empresa:  "Anuncios de empresa"
  la-empresa:        "La empresa"
  oficial:           "Oficial"
  proveedor:         "Proveedor"
  analistas:         "Firma de analistas"
  activista:         "Activista"
  banco:             "Banco"
  consultora:        "Consultora o investigación"
  agregador:         "Agregador"
  tienda:            "Tienda"

# Marcas que se muestran junto a cada noticia (método del documento)
marcas:
  muro-de-pago:   { texto: "Muro de pago",          explicacion: "Puede que solo se lea el titular y la bajada." }
  techday:        { texto: "Anuncio vía TechDay",   explicacion: "Anuncio de empresa republicado por la red TechDay; conviene buscar la fuente original." }
  comunicado:     { texto: "Comunicado de empresa", explicacion: "No es prensa: lo escribe la empresa." }
  la-empresa:     { texto: "La empresa",            explicacion: "Fuente primaria, pero la empresa habla de sí misma." }
  oficial:        { texto: "Oficial",               explicacion: "Fuente primaria oficial." }
  proveedor:      { texto: "Proveedor",             explicacion: "Vende la solución al problema que describe; contrastar el dato." }
  activista:      { texto: "Activista",             explicacion: "Tiene interés en el tema; contrastar el dato." }
  banco:          { texto: "Banco",                 explicacion: "Tiene interés en el tema (p. ej., financiación climática)." }
  analistas:      { texto: "Firma de analistas",    explicacion: "Sus estudios a menudo los patrocinan proveedores; revisar quién, muestra y regiones." }
  agencia:        { texto: "Republica agencias",    explicacion: "Republica notas de agencias como Reuters." }
  patrocinado:    { texto: "Posible patrocinio",    explicacion: "El texto menciona patrocinio; revisar por quién." }

