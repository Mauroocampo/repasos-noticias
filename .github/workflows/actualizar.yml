name: Actualizar y publicar

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 a. m. en Colombia (UTC-5, sin horario de verano)
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano desde GitHub
  push:
    branches: [main]        # al cambiar código o configuración, se publica de inmediato

permissions:
  contents: write   # guardar datos/ en el repositorio
  pages: write      # publicar en GitHub Pages
  id-token: write

concurrency:
  group: actualizar-y-publicar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Actualizar noticias y generar el sitio
        run: python actualizar.py
        # Fase 2: cuando se active la IA, la clave llegará así (nunca en el código):
        # env:
        #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "Sin cambios en datos/"
          else
            git commit -m "Datos: actualización $(TZ=America/Bogota date +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: publicar
        uses: actions/deploy-pages@v4
