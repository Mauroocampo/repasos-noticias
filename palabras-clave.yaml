# ─────────────────────────────────────────────────────────────────────────────
# HISTORIAS: notas distintas sobre la misma historia se agrupan en "También en".
# Dos notas son la misma historia si se publicaron con menos de `ventana_horas`
# de diferencia (respecto a la nota más reciente del grupo) y comparten
# entidades distintivas: nombres propios, empresas, siglas y cifras.
# ─────────────────────────────────────────────────────────────────────────────
historias:
  activo: true
  ventana_horas: 48
  # Comparten al menos 2 entidades y 1 palabra clave del hecho (p. ej. Huang + Nvidia + espía)
  min_entidades: 2
  # …o al menos 3 entidades, aunque no compartan palabras clave
  min_entidades_solas: 3
  # …o 1 entidad y titulares muy parecidos (0 a 100)
  similitud_titular: 70
  # Una palabra que aparece en más de este porcentaje de las notas no distingue una historia
  max_frecuencia: 0.05
  # Tamaño máximo de un grupo
  max_grupo: 60
  # Una historia necesita notas de al menos este número de fuentes distintas
  min_fuentes: 2
  # Una palabra con mayúscula solo es nombre propio si sale en minúscula en menos de
  # este porcentaje de sus apariciones ("Critical", "Files" no lo son)
  max_minuscula: 0.25
  # Palabras que una fuente repite en más de este porcentaje de sus notas se ignoran
  max_por_fuente: 0.2
  # Entidades demasiado generales: nunca cuentan para unir
  genericas: [
    estados, unidos, ee, uu, eeuu, us, usa, america, americano, american, trump, donald, biden,
    china, chino, chinos, chinese, colombia, colombiano, colombian, gobierno, government, gobiernos,
    presidente, president, ministro, minister, ceo, cfo, cto, ia, ai, inteligencia, artificial,
    mexico, brasil, brazil, europa, europe, european, eu, ue, uk, india, rusia, russia, ucrania, ukraine,
    iran, israel, japon, japan, alemania, germany, francia, france, espana, spain, canada, australia,
    australian, australians, nz, asia, africa, latinoamerica, latam, america latina,
    fed, reserva, federal, banco, bank, central, nacional, national, global, mundial, world, internacional,
    international, nuevo, nueva, new, primer, primera, first, gran, big, top, best, mejor, mejores,
    millones, million, millions, billion, billones, mil, us$, usd, cop, eur, dolar, dolares, dollar, dollars,
    2025, 2026, 2027, q1, q2, q3, q4, inc, corp, corporation, ltd, plc, sa, sas, llc, group, grupo,
    company, compania, empresa, empresas, companies, mercado, mercados, market, markets, sector,
    enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre,
    january, february, march, april, may, june, july, august, september, october, november, december,
    lunes, martes, miercoles, jueves, viernes, sabado, domingo,
    monday, tuesday, wednesday, thursday, friday, saturday, sunday,
    news, noticias, report, reports, informe, update, live, daily, weekly, ot, it, security, seguridad,
    announces, anuncia, launches, lanza, says, dice, according, segun, how, why, what, que, por, como,
    # nombres de dos palabras que, separados, contarían dos veces
    wall, street, york, white, house, casa, blanca, silicon, valley, hong, kong, united, states, kingdom,
    reino, unido, union, europea, latina, sur, south, north, norte, east, west, middle, medio, oriente
  ]
  # En una historia de 3 o más notas, también se une una nota que comparte 1 entidad y
  # al menos este número de palabras clave del hecho
  min_claves_con_una_entidad: 2
  # Equivalencias entre idiomas: cada lista cuenta como una sola palabra
  equivalencias:
    - [espia, espias, spy, spies, espionaje, espionage]
    - [infidelidad, affair, amante, mistress, extramarital]
    - [escandalo, scandal]
    - [divorcio, divorce]
    - [despido, despidos, layoff, layoffs, recortes, recorta, recortara, cuts]
    - [arancel, aranceles, tariff, tariffs]
    - [adquisicion, adquiere, acquisition, acquire, acquires, compra, buys]
    - [fusion, merger]
    - [demanda, lawsuit, sues, demandas]
    - [huelga, strike]
    - [quiebra, bankruptcy]
    - [hackeo, hackers, hack, hacks, ciberataque, cyberattack, breach]
    - [elecciones, election, elections, midterm, midterms]
    - [refrigeracion, refrigeration, freezer, freezers, congelador, congeladores, nevera]
    - [inflacion, inflation]
    - [petroleo, oil, crudo]
    - [resultados, results, earnings, ganancias]
    - [investigacion, investigation, probe]

