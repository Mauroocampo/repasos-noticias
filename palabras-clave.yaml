# ─────────────────────────────────────────────────────────────────────────────
# palabras-clave.yaml — reglas para clasificar las noticias POR CONTENIDO
#
# La temática de cada nota sale de su titular y su bajada, no de la fuente.
# Este archivo se puede editar sin tocar código.
#
# Qué significa cada lista de una temática:
#   incluir       basta UNA de estas palabras para que la nota entre.
#   ambiguas      palabras que por sí solas engañan (p. ej. "PLC" también es
#                 un tipo de empresa). Solo cuentan si además aparece alguna
#                 palabra de `acompanantes`.
#   acompanantes  palabras que confirman a las ambiguas.
#   excluir       si aparece alguna, la nota NO entra en la temática.
#
# Reglas de escritura:
#   - No importan mayúsculas ni tildes: "economia" encuentra "Economía".
#   - Se busca la palabra completa: "IA" no encuentra "Asia".
#   - Un * al final es "empieza por": "sostenib*" encuentra sostenible,
#     sostenibilidad, sostenibles.
#   - Frases entre comillas: "banco de la republica".
#
# A qué fuentes se aplica:
#   - Fijas y especializadas conservan su temática propia (un medio de
#     ciberseguridad sigue en Ciberseguridad IT) y SUMAN las que diga el
#     contenido, entre las de su lista `tematicas_por_filtro` en fuentes.yaml.
#   - Medios generales: solo entran las notas que pasan estas reglas.
#   - Las temáticas de `tematicas_abiertas` (abajo) valen para TODAS las fuentes.
#
# Colombia depende siempre del contenido:
#   - Medio colombiano (`pais: CO`): la nota es de Colombia salvo que sea del
#     exterior y no mencione a Colombia (`contexto`). Es del exterior si está en
#     la sección internacional del medio (`secciones_exterior` en fuentes.yaml,
#     p. ej. /globoeconomia/ en La República) o, si el medio no tiene esa
#     sección, si tiene palabras de `exterior`.
#     Las notas del exterior de Portafolio, La República y Agronegocios van a
#     Internacional; las de los medios generales solo entran si además pasan
#     las palabras clave de Internacional.
#   - Medio extranjero: solo es de Colombia si menciona alguna palabra de `contexto`.
# ─────────────────────────────────────────────────────────────────────────────

ajustes:
  # Temáticas que cualquier fuente puede recibir si el contenido lo dice
  tematicas_abiertas: [ciber-ot]
  # A dónde van las notas de medios colombianos que tratan de otro país
  tematica_exterior: internacional

# Entradas que NO son noticias y se descartan (páginas de sección, paginación, portadas)
no_noticias:
  # En el titular. El signo # significa "un número cualquiera".
  titulares:
    - "page # of #"
    - "pagina # de #"
    - ", author at "
    - "- page #"
  # En la dirección de la nota (no aplica a los enlaces de Google News, que no la muestran)
  rutas: ["/page/", "/category/", "/categoria/", "/tag/", "/tags/", "/etiqueta/", "/author/", "/autor/"]
  # Descartar enlaces a la portada del sitio y titulares que son el nombre del medio
  portadas: true

# ─────────────────────────────────────────────────────────────────────────────
# Filtro de RELEVANCIA: notas que no corresponden a las temáticas.
# No se borran: quedan ocultas y se ven con la casilla "Mostrar descartadas".
#   texto         etiqueta que se muestra ("Oculta: ofertas")
#   incluir       palabras que detectan la categoría (titular y bajada)
#   solo_titular  true: `incluir` se busca solo en el titular
#   al_inicio     el titular empieza así
#   al_final      el titular termina así
#   excepto       si aparece alguna, la nota NO se oculta
