# ─────────────────────────────────────────────────────────────────────────────
# palabras-clave.yaml — filtro por temática
#
# Se aplica a:
#   - los medios generales (grupo: general), y
#   - las temáticas extra (`tematicas_por_filtro`) de fijas y especializadas.
#
# Una nota entra en una temática si su titular o bajada contiene alguna
# palabra de `incluir` y ninguna de `excluir`.
#
# Reglas de escritura:
#   - No importan mayúsculas ni tildes: "economia" encuentra "Economía".
#   - Se busca la palabra completa: "IA" no encuentra "Asia".
#   - Un * al final es "empieza por": "sostenib*" encuentra sostenible,
#     sostenibilidad, sostenibles.
#   - Frases entre comillas: "banco de la republica".
#
# Temática Colombia: si el medio NO es colombiano (sin `pais: CO` en
# fuentes.yaml), la nota además debe tener alguna palabra de `contexto`.
# ─────────────────────────────────────────────────────────────────────────────

colombia:
  contexto: [colombia, colombian*, bogota, medellin, cali, barranquilla, cartagena, bucaramanga, petro, ecopetrol]
  incluir:
